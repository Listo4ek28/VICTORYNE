<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Профиль - ВИКТОРИНА+</title>
    <style>
        .profile-container {
            max-width: 800px;
            margin: 100px auto 40px;
            padding: 40px;
            background: linear-gradient(135deg, rgba(17, 17, 17, 0.95) 0%, rgba(25, 25, 25, 0.9) 100%);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        .profile-header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, var(--beta-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .profile-header::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--beta-accent), transparent);
        }
        
        .profile-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .profile-avatar-section {
            text-align: center;
        }
        
        .profile-avatar {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--beta-accent);
            box-shadow: 0 10px 30px rgba(255, 81, 125, 0.3);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .profile-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 81, 125, 0.4);
        }
        
        .profile-info-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 81, 125, 0.2);
        }
        
        .profile-field {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .profile-field:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .profile-field-label {
            flex: 0 0 180px;
            font-weight: 600;
            color: var(--beta-text);
            font-size: 1.1em;
        }
        
        .profile-field-value {
            flex: 1;
            color: var(--beta-text-secondary);
            font-size: 1.1em;
        }
        
        .username-field {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .username-value {
            color: var(--beta-text);
            font-weight: 600;
            font-size: 1.3em;
        }
        
        .edit-username-btn {
            background: rgba(255, 81, 125, 0.2);
            color: var(--beta-accent);
            border: 1px solid rgba(255, 81, 125, 0.3);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .edit-username-btn:hover {
            background: rgba(255, 81, 125, 0.4);
            transform: rotate(15deg) scale(1.1);
        }
        
        .profile-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .profile-btn {
            min-width: 180px;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .logout-btn {
            background: linear-gradient(135deg, rgba(255, 81, 125, 0.2) 0%, rgba(255, 81, 125, 0.3) 100%);
            color: var(--beta-accent);
            border: 1px solid rgba(255, 81, 125, 0.4);
        }
        
        .logout-btn:hover {
            background: linear-gradient(135deg, rgba(255, 81, 125, 0.4) 0%, rgba(255, 81, 125, 0.5) 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 81, 125, 0.3);
        }
        
        .delete-btn {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.2) 0%, rgba(255, 68, 68, 0.3) 100%);
            color: var(--beta-error);
            border: 1px solid rgba(255, 68, 68, 0.4);
        }
        
        .delete-btn:hover {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.4) 0%, rgba(255, 68, 68, 0.5) 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 68, 68, 0.3);
        }
        
        .back-to-home {
            text-align: center;
            margin-top: 30px;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--beta-text);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .edit-username-form {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        
        .edit-username-form input {
            flex: 1;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 81, 125, 0.2);
            border-radius: 10px;
            color: var(--beta-text);
            font-size: 1.1em;
            font-family: 'Inter', sans-serif;
        }
        
        .edit-username-form input:focus {
            outline: none;
            border-color: var(--beta-accent);
            background: rgba(255, 81, 125, 0.12);
        }
        
        .form-actions {
            display: flex;
            gap: 10px;
        }
        
        .save-username-btn, .cancel-username-btn {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        
        .save-username-btn {
            background: rgba(0, 255, 136, 0.2);
            color: var(--beta-success);
        }
        
        .save-username-btn:hover {
            background: rgba(0, 255, 136, 0.4);
        }
        
        .cancel-username-btn {
            background: rgba(255, 68, 68, 0.2);
            color: var(--beta-error);
        }
        
        .cancel-username-btn:hover {
            background: rgba(255, 68, 68, 0.4);
        }
        
        @media (max-width: 768px) {
            .profile-container {
                margin: 80px 20px 30px;
                padding: 25px;
            }
            
            .profile-header h1 {
                font-size: 2em;
            }
            
            .profile-field {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            
            .profile-field-label {
                flex: none;
                width: 100%;
            }
            
            .profile-actions {
                flex-direction: column;
                gap: 15px;
            }
            
            .profile-btn {
                width: 100%;
            }
            
            .profile-avatar {
                width: 140px;
                height: 140px;
            }
        }
        
        @media (max-width: 480px) {
            .profile-container {
                margin: 70px 15px 20px;
                padding: 20px;
            }
            
            .profile-header h1 {
                font-size: 1.7em;
            }
            
            .username-field {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .edit-username-form {
                flex-direction: column;
                gap: 10px;
            }
            
            .form-actions {
                width: 100%;
                justify-content: center;
            }
        }
        
        /* Контейнер для аватара с кнопкой редактирования */
	.avatar-container {
	    position: relative;
	    display: inline-block;
	    margin-bottom: 15px;
	}

	/* Кнопка редактирования аватара */
	.edit-avatar-btn {
	    position: absolute;
	    bottom: 10px;
	    right: 10px;
	    background: linear-gradient(135deg, var(--beta-accent) 0%, var(--beta-accent-hover) 100%);
	    color: white;
	    width: 40px;
	    height: 40px;
	    border-radius: 50%;
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    cursor: pointer;
	    transition: all 0.3s ease;
	    border: 3px solid var(--beta-bg);
	    box-shadow: 0 4px 15px rgba(255, 81, 125, 0.4);
	    z-index: 10;
	}

	.edit-avatar-btn:hover {
	    transform: rotate(15deg) scale(1.1);
	    box-shadow: 0 6px 20px rgba(255, 81, 125, 0.6);
	}

	/* Секция изменения аватара */
	.avatar-edit-section {
	    background: rgba(255, 255, 255, 0.05);
	    border-radius: 15px;
	    padding: 25px;
	    border: 1px solid rgba(255, 81, 125, 0.2);
	    margin-top: 20px;
	    animation: fadeIn 0.5s ease;
	}

	.avatar-edit-section .form-group {
	    margin-bottom: 20px;
	}

	.avatar-edit-section label {
	    display: block;
	    margin-bottom: 12px;
	    color: var(--beta-text);
	    font-weight: 600;
	    font-size: 1.1em;
	}

	.avatar-edit-section input[type="file"] {
	    width: 100%;
	    padding: 15px;
	    background: rgba(255, 255, 255, 0.08);
	    border: 2px solid rgba(255, 81, 125, 0.2);
	    border-radius: 10px;
	    color: var(--beta-text);
	    cursor: pointer;
	    font-family: 'Inter', sans-serif;
	    transition: all 0.3s ease;
	}

	.avatar-edit-section input[type="file"]:hover {
	    border-color: var(--beta-accent);
	    background: rgba(255, 81, 125, 0.1);
	}

	.avatar-edit-section .file-info {
	    margin-top: 8px;
	    color: var(--beta-text-secondary);
	    font-size: 0.9em;
	    font-style: italic;
	}

	/* Контейнер предпросмотра аватара */
	.avatar-preview-container {
	    text-align: center;
	    margin: 20px 0;
	    padding: 20px;
	    background: rgba(255, 255, 255, 0.03);
	    border-radius: 12px;
	    border: 1px dashed rgba(255, 81, 125, 0.3);
	}

	.avatar-preview {
	    width: 150px;
	    height: 150px;
	    border-radius: 50%;
	    object-fit: cover;
	    border: 3px solid var(--beta-accent);
	    box-shadow: 0 8px 25px rgba(255, 81, 125, 0.3);
	    margin-top: 15px;
	}

	/* Кнопки для формы аватара */
	.avatar-edit-section .form-actions {
	    display: flex;
	    gap: 15px;
	    margin-top: 20px;
	}

	.save-avatar-btn, .cancel-avatar-btn {
	    flex: 1;
	    padding: 12px 20px;
	    border-radius: 10px;
	    border: none;
	    cursor: pointer;
	    font-weight: 600;
	    transition: all 0.3s ease;
	    font-size: 1em;
	}

	.save-avatar-btn {
	    background: linear-gradient(135deg, rgba(0, 255, 136, 0.2) 0%, rgba(0, 255, 136, 0.3) 100%);
	    color: var(--beta-success);
	    border: 1px solid rgba(0, 255, 136, 0.4);
	}

	.save-avatar-btn:hover {
	    background: linear-gradient(135deg, rgba(0, 255, 136, 0.4) 0%, rgba(0, 255, 136, 0.5) 100%);
	    transform: translateY(-2px);
	    box-shadow: 0 6px 15px rgba(0, 255, 136, 0.3);
	}

	.cancel-avatar-btn {
	    background: linear-gradient(135deg, rgba(255, 68, 68, 0.2) 0%, rgba(255, 68, 68, 0.3) 100%);
	    color: var(--beta-error);
	    border: 1px solid rgba(255, 68, 68, 0.4);
	}

	.cancel-avatar-btn:hover {
	    background: linear-gradient(135deg, rgba(255, 68, 68, 0.4) 0%, rgba(255, 68, 68, 0.5) 100%);
	    transform: translateY(-2px);
	    box-shadow: 0 6px 15px rgba(255, 68, 68, 0.3);
	}
    </style>
</head>
<body>
    <header>
        <div class="user-info">
            <a href="#" id="back-to-main-btn" class="back-btn">
                <i class="fas fa-arrow-left"></i> На главную
            </a>
        </div>
    </header>
    
    <main>
        <div class="profile-container">
            <div class="profile-header">
                <h1>Мой профиль</h1>
            </div>
            
            <div class="profile-content">
                <div class="profile-avatar-section">
				    <div class="avatar-container">
				        <img id="profile-avatar" class="profile-avatar" src="https://i.pravatar.cc/150?img=12" alt="Аватар пользователя">
				        <div id="edit-avatar-btn" class="edit-avatar-btn" title="Изменить аватар">
				            <i class="fas fa-camera"></i>
				        </div>
				    </div>
				    <p>Нажмите на камеру для изменения аватара</p>
				</div>

				<!-- Добавьте форму изменения аватара (скрытую по умолчанию) -->
				<div id="avatar-edit-section" class="avatar-edit-section" style="display: none;">
				    <div class="form-group">
				        <label for="avatar-file-input">Выберите новый аватар:</label>
				        <input type="file" id="avatar-file-input" accept="image/*">
				        <div class="file-info">Рекомендуемый размер: 200x200 пикселей</div>
				    </div>
				    
				    <div id="avatar-preview-container" class="avatar-preview-container" style="display: none;">
				        <p>Предпросмотр:</p>
				        <img id="avatar-preview" class="avatar-preview" src="" alt="Предпросмотр">
				    </div>
				    
				    <div class="form-actions">
				        <button id="save-avatar-btn" class="save-avatar-btn">Сохранить аватар</button>
				        <button id="cancel-avatar-btn" class="cancel-avatar-btn">Отмена</button>
				    </div>
				</div>
                
                <div class="profile-info-section">
                    <div class="profile-field">
                        <div class="profile-field-label">Никнейм:</div>
                        <div class="profile-field-value">
                            <div id="username-display-section" class="username-field">
                                <span id="username-value" class="username-value"></span>
                                <div id="edit-username-btn" class="edit-username-btn" title="Редактировать">
                                    <i class="fas fa-pencil-alt"></i>
                                </div>
                            </div>
                            <div id="username-edit-section" class="edit-username-form" style="display: none;">
                                <input type="text" id="new-username-input" placeholder="Новый никнейм">
                                <div class="form-actions">
                                    <button id="save-username-btn" class="save-username-btn">Сохранить</button>
                                    <button id="cancel-username-btn" class="cancel-username-btn">Отмена</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="profile-field">
                        <div class="profile-field-label">Телефон:</div>
                        <div class="profile-field-value" id="phone-value"></div>
                    </div>
                    
                    <div class="profile-field">
                        <div class="profile-field-label">Дата регистрации:</div>
                        <div class="profile-field-value" id="reg-date-value"></div>
                    </div>
                </div>
                
                <div class="profile-actions">
                    <button id="logout-btn" class="profile-btn logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Выйти
                    </button>
                    <button id="delete-account-btn" class="profile-btn delete-btn">
                        <i class="fas fa-trash-alt"></i> Удалить аккаунт
                    </button>
                </div>
            </div>
            
            <div class="back-to-home">
                <a href="index.html" class="back-btn">
                    <i class="fas fa-home"></i> Вернуться на главную
                </a>
            </div>
        </div>
    </main>
    
    <footer>
        <p>(с) Викторина+, 2026. Все права защищены.</p>
        <h4>Поддержка:</h4>
        <p>tel.: 8(███)███-██-██</p>
        <p>tg: @Listo4ek28</p>
        <p>=== LST inc dev ===</p>
        
    </footer>
    
    <script src="profile.js"></script>
</body>
</html>
