<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Викторина - ВИКТОРИНА+</title>
</head>
<body>
    <header>
        <div class="user-info">
            <a href="index.html" class="username">На главную</a>
            <div id="user-avatar">
                <img id="avatar-img" src="https://i.pravatar.cc/50?img=12" alt="Аватар пользователя">
            </div>
        </div>
    </header>
    
    <main>
        <section id="title">
            <p id="quiz-title">ВИКТОРИНА</p>
        </section>
        
        <section id="modes">
            <div id="quiz-container">
                <div id="question-info">
                    <p>Вопрос <span id="current-question">1</span> из <span id="total-questions">10</span></p>
                    <p>Тема: <span id="topic-name">История</span></p>
                    <p>Счет: <span id="score">0</span> баллов</p>
                </div>
                
                <hr>
                
                <div id="question-text">
                    <!-- Вопрос будет загружен через JavaScript -->
                </div>
                
                <div id="answers-container">
                    <!-- Варианты ответов будут загружены через JavaScript -->
                </div>
                
                <div id="timer">
                    <p>Осталось времени: <span id="time-left">30</span> сек</p>
                </div>
                
                <hr>
                
                <div id="quiz-controls">
                    <button id="next-question" style="display: none;">Следующий вопрос</button>
                    <button id="end-quiz" style="display: none;">Завершить викторину</button>
                </div>
            </div>
            <button id="back-btn" class="btn-back">Назад к темам</button>

            <!-- Блок для сообщений о сохранении -->
            <div id="save-result-message" style="display: none; margin-top: 20px; padding: 15px; border-radius: 8px;"></div>
        </section>
    </main>
    
    <footer>
        <p>(с) Викторина+, 2026</p>
        <p>(с) Все права защищены.</p>
    </footer>
    
    <script src="quiz.js"></script>
</body>
</html>
